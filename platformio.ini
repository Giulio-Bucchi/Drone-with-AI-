; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dfrobot_firebeetle2_esp32s3]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Impostazioni fondamentali per Camera, PSRAM e USB
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_FACE_DETECT_ENABLED=0
    -DCONFIG_ESP_FACE_RECOGNITION_ENABLED=0
    -DCONFIG_CAMERA_TASK_STACK_SIZE=8192
    -DCONFIG_LOG_DEFAULT_LEVEL=0
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Librerie necessarie (PlatformIO le scarica da solo!)
lib_deps = 
    https://github.com/espressif/esp32-camera
    adafruit/Adafruit PWM Servo Driver Library
